name: Refresh and deploy Vault Pulse

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  # To restart ticker.yml if its chain ever dies. See the last step.
  actions: write

concurrency:
  group: vault-pulse-pages
  # A refresh normally finishes in under a minute. Replacing an older run is
  # intentional: it also clears a Pages deployment stuck in waiting.
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test dashboard refresh
        run: node --test scripts/*.test.mjs

      - name: Refresh platform data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_THEARCHIVELIVES: ${{ secrets.YT_REFRESH_THEARCHIVELIVES }}
          YT_REFRESH_FIXEDFIGHTS: ${{ secrets.YT_REFRESH_FIXEDFIGHTS }}
          YT_REFRESH_SYLVASMYSTERIES: ${{ secrets.YT_REFRESH_SYLVASMYSTERIES }}
          YT_REFRESH_ANIMEVAULT: ${{ secrets.YT_REFRESH_ANIMEVAULT }}
          YT_REFRESH_AXOLOTLDRAMA: ${{ secrets.YT_REFRESH_AXOLOTLDRAMA }}
          # Direct TikTok read. Present these and a channel bypasses the Render
          # proxy below; TikTok does not rotate refresh tokens, so re-using one
          # static secret every run consumes nothing.
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_AXOLOTL2: ${{ secrets.TT_REFRESH_AXOLOTL2 }}
          TT_REFRESH_ANIMEHYPE41: ${{ secrets.TT_REFRESH_ANIMEHYPE41 }}
          TT_REFRESH_THEARCHIVELIVES: ${{ secrets.TT_REFRESH_THEARCHIVELIVES }}
          TT_REFRESH_SYLVASMYSTERIES: ${{ secrets.TT_REFRESH_SYLVASMYSTERIES }}
          TT_REFRESH_FIXEDSPORTSHISTORY: ${{ secrets.TT_REFRESH_FIXEDSPORTSHISTORY }}
          # Kept as the fallback until the direct path is confirmed at parity on
          # every channel. Each channel reports which one served it as
          # channel.tiktokSource in site/data/dashboard.json.
          VAULT_PULSE_TIKTOK_API_URL: https://testing-multiplayer-server.onrender.com/vault-pulse/api/tiktok
          VAULT_PULSE_INSTAGRAM_API_URL_HISTORY: https://instagram-media.sylvasblessing.com/analytics/v1
          VAULT_PULSE_INSTAGRAM_API_URL_ANIME: https://instagram-media.sylvasblessing.com/anime/analytics/v1
          VAULT_PULSE_INSTAGRAM_API_URL_MYSTERIES: https://instagram-media.sylvasblessing.com/mysteries/analytics/v1
          VAULT_PULSE_INSTAGRAM_API_URL_FIXED_FIGHTS: https://instagram-media.sylvasblessing.com/fixed-fights/analytics/v1
          VAULT_PULSE_DATA_TOKEN: ${{ secrets.VAULT_PULSE_DATA_TOKEN }}
          TIKTOK_ACCESS_TOKEN_AXOLOTL_DRAMA: ${{ secrets.TIKTOK_ACCESS_TOKEN_AXOLOTL_DRAMA }}
          TIKTOK_ACCESS_TOKEN_ANIME_COUNTDOWN_VAULT: ${{ secrets.TIKTOK_ACCESS_TOKEN_ANIME_COUNTDOWN_VAULT }}
          TIKTOK_ACCESS_TOKEN_KIDS_HISTORY: ${{ secrets.TIKTOK_ACCESS_TOKEN_KIDS_HISTORY }}
        run: node scripts/refresh-data.mjs

      - name: Preserve refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- site/data/dashboard.json; then
            exit 0
          fi
          git config user.name "vault-pulse-bot"
          git config user.email "vault-pulse-bot@users.noreply.github.com"
          git add site/data/dashboard.json
          git commit -m "Refresh channel analytics"
          # The concurrency group queues runs rather than cancelling them, so a
          # waiting run resumes with a checkout that is already behind whatever
          # the run ahead of it pushed. A bare `git push` then fails and takes
          # the whole deploy down with it. Rebase onto the newer snapshot and
          # retry -- these commits only ever touch dashboard.json.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) - replaying snapshot onto origin/main"
            git fetch --quiet origin main
            # Do NOT rebase. Every run rewrites dashboard.json in full, so
            # replaying one complete rewrite onto another conflicts every time.
            # This file is a snapshot, not a patch: the newest read wins.
            # --mixed moves HEAD and the index to origin/main but leaves the
            # working tree alone, so the freshly-refreshed file is still on disk
            # and simply gets re-staged against the new base.
            git reset --quiet --mixed origin/main
            git add site/data/dashboard.json
            if git diff --cached --quiet; then
              echo "identical to origin/main - nothing to push"
              exit 0
            fi
            git commit --quiet -m "Refresh channel analytics"
          done
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keep the ticker alive
        # ticker.yml is the 15-minute clock, and this run is normally one of its
        # ticks -- so a healthy ticker makes this a no-op, which is the usual
        # case. It matters for the one failure this design has: the ticker hands
        # off to its own successor every ~5.25 h, and if a handoff is ever lost
        # the clock stops silently. This makes any refresh, from any trigger,
        # resurrect it. The two mechanisms hold each other up, with the crons
        # underneath as a last resort.
        #
        # Deliberately `always()`: a refresh that failed still proves a runner
        # got here, and a dead clock is worth restarting either way.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          alive=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ticker.yml --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length' \
            2>/dev/null) || alive=""

          if [ -z "$alive" ]; then
            # Never fail the deploy over the watchdog-of-a-watchdog.
            echo "::warning::could not read ticker state; leaving it alone"
          elif [ "$alive" -gt 0 ]; then
            echo "ticker alive ($alive run(s)) - nothing to do"
          else
            echo "no ticker running - restarting the chain"
            gh workflow run ticker.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning::ticker restart dispatch failed"
          fi
