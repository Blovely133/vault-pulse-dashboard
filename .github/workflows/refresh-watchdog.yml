name: Guard scheduled Vault Pulse refreshes

on:
  schedule:
    # THE ONLY SCHEDULED TRIGGER LEFT IN THIS REPO, AND IT IS A BACKSTOP, NOT
    # THE CLOCK. The 15-minute refresh is driven by the `vault-pulse-tick`
    # systemd timer on ops-box (see automation/vault-pulse-tick), because
    # GitHub's scheduler delivered only ~40% of slots here - a dashboard
    # promising 15 minutes showed numbers 20-50 minutes old. These four asks
    # land a minute before each box tick and only dispatch when the snapshot is
    # genuinely stale, so the normal case costs nothing.
    #
    # This is a REAL guard now in a way it was not before. While the primary
    # was also a GitHub cron, this ran on the same throttled scheduler and
    # failed with it - a guard that runs on the mechanism it guards is not a
    # guard. Backstopping a box timer makes it an independent mechanism: if the
    # box dies, this is the thing that notices.
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check snapshot age
        id: freshness
        shell: bash
        run: echo "stale=$(node scripts/check-freshness.mjs 12)" >> "$GITHUB_OUTPUT"

      - name: Check for an active refresh
        if: steps.freshness.outputs.stale == 'true'
        id: active_refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --limit 20 \
            --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover a missed refresh
        if: >-
          steps.freshness.outputs.stale == 'true' &&
          steps.active_refresh.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
