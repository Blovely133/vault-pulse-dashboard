name: Vault Pulse ticker

# A short, stateless 15-minute clock. Each run sends one refresh request and
# exits; it never holds a hosted runner between ticks.
on:
  workflow_dispatch:
  schedule:
    - cron: "9,24,39,54 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: vault-pulse-ticker
  cancel-in-progress: true

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch one refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
