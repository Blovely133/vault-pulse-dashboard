name: Vault Pulse ticker

# A 15-minute clock that does not depend on GitHub's cron, and needs no
# credential of any kind.
#
# WHY. GitHub's `schedule` trigger drops slots rather than queueing them. This
# repo asks four times an hour and was measured delivering 13 runs in 23 hours
# -- 14%, gaps up to 3h19m, never once a 15-minute interval. It looked healthy
# for months only because an external ticker of unknown origin dispatched
# pages.yml every 15 minutes; that ticker stopped at 2026-08-05T17:15:03Z and
# the real rate became visible. refresh-watchdog.yml cannot cover it: it runs
# on the same dropped scheduler.
#
# HOW. This job holds a runner and dispatches pages.yml every 15 minutes for
# ~5.25 hours, then starts its own successor and exits. The chain is the clock.
#
# NO TOKEN NEEDED. `github.token` can dispatch a workflow in its own repository
# -- refresh-watchdog.yml has been doing exactly that all along. A personal
# access token was never actually required for this; only for driving it from
# outside the repo.
#
# COST. One continuously-held hosted runner. Actions minutes are free and
# unmetered on public repositories, and 1 concurrent job sits far inside the
# 20-job allowance. The work is this repository's own publish pipeline, not
# unrelated compute. To stop it: disable this workflow in the Actions tab, or
# delete this file. Nothing else depends on it -- pages.yml's own cron and the
# watchdog both stay in place as the degraded-mode fallback.

on:
  workflow_dispatch:
  schedule:
    # Seed and self-heal ONLY -- this is not the clock. If a handoff is ever
    # lost, this restarts the chain. The guard below makes every seed safe: it
    # never dispatches while a refresh is already active.
    - cron: "9,24,39,54 * * * *"

permissions:
  actions: write
  contents: read

# One ticker at a time. A successor dispatched while this one is still winding
# down queues instead of running alongside it.
concurrency:
  group: vault-pulse-ticker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # 21 ticks x 15 min = 315 min, plus headroom. Hosted jobs cap at 360.
    timeout-minutes: 345
    steps:
      - name: Dispatch a refresh every 15 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          nudge_refresh() {
            local runs stale_id active status

            if ! runs=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?per_page=100"); then
              echo "::warning::could not read refresh workflow state; skipping this tick"
              return 0
            fi

            # A Pages deployment can occasionally remain in GitHub's waiting
            # state forever. It then owns the workflow concurrency group, while
            # every later refresh is repeatedly replaced in the pending slot.
            # Give legitimate deployments 25 minutes, then clear only the
            # oldest wedged waiter. An existing pending run will start next.
            if ! stale_id=$(jq -r --argjson cutoff "$(( $(date +%s) - 1500 ))" '
              [.workflow_runs[]
                | select(.status == "waiting")
                | select((.updated_at | fromdateiso8601) <= $cutoff)]
              | sort_by(.updated_at)
              | first
              | .id // empty
            ' <<<"$runs"); then
              echo "::warning::could not parse refresh workflow state; skipping this tick"
              return 0
            fi

            if [ -n "$stale_id" ]; then
              echo "cancelling stale waiting refresh $stale_id"
              gh run cancel "$stale_id" --repo "$GITHUB_REPOSITORY" \
                || echo "::warning::could not cancel stale refresh $stale_id"

              # Give GitHub time to release the concurrency group. If it does
              # not, the active-run guard below safely leaves it alone.
              for attempt in $(seq 1 12); do
                status=$(gh api \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$stale_id" \
                  --jq .status 2>/dev/null) || status="unknown"
                [ "$status" = "completed" ] && break
                sleep 5
              done

              runs=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?per_page=100") \
                || return 0
            fi

            if ! active=$(jq '[.workflow_runs[] | select(
              .status == "in_progress" or
              .status == "queued" or
              .status == "pending" or
              .status == "waiting" or
              .status == "requested"
            )] | length' <<<"$runs"); then
              echo "::warning::could not count active refreshes; skipping this tick"
              return 0
            fi

            if [ "$active" -gt 0 ]; then
              echo "$active refresh run(s) already active; leaving them alone"
              return 0
            fi

            if gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "refresh dispatched at $(date -u +%H:%M:%SZ)"
            else
              echo "::warning::refresh dispatch failed"
            fi
          }

          TICKS=21
          for i in $(seq 1 "$TICKS"); do
            echo "tick $i/$TICKS at $(date -u +%H:%M:%SZ)"
            nudge_refresh
            if [ "$i" -lt "$TICKS" ]; then
              # GitHub can reap a hosted job after a long silent period. Keep
              # the runner visibly alive while preserving the 15-minute clock.
              for minute in $(seq 1 15); do
                sleep 60
                echo "next tick in $((15 - minute)) minute(s)"
              done
            fi
          done

      - name: Start the next generation
        # always() so a timeout or a failed loop still hands off. Losing this is
        # the one thing that breaks the chain; the cron above is the backstop.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ticker.yml --repo "$GITHUB_REPOSITORY" --ref main
