name: YT secrets bridge

# One-time maintenance lane (2026-07-30): replicate this repo's YouTube OAuth
# secrets to Blovely133/automation, so the private daily analytics workflow can
# run there next to the data it commits (private repo, private logs). GitHub
# Actions secrets are write-only, so the only way to move one is through a
# workflow that holds it in env.
#
# No value ever appears in a log or in the clear in an artifact: each one is
# encrypted to the dispatcher's RSA-4096 public key (OAEP-SHA256) -- the same
# pattern tiktok-grant.yml uses for freshly minted refresh tokens. The
# dispatcher decrypts locally, stores each value with
# `gh secret set --repo Blovely133/automation`, deletes the artifact, and then
# removes this workflow file.
#
# This workflow touches nothing on YouTube. It reads no API and writes no data.

on:
  workflow_dispatch:
    inputs:
      pubkey_b64:
        description: "base64-encoded RSA public key PEM the values are encrypted to"
        required: true

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt secrets to the dispatcher key
        env:
          PUB: ${{ inputs.pubkey_b64 }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_THEARCHIVELIVES: ${{ secrets.YT_REFRESH_THEARCHIVELIVES }}
          YT_REFRESH_FIXEDFIGHTS: ${{ secrets.YT_REFRESH_FIXEDFIGHTS }}
          YT_REFRESH_SYLVASMYSTERIES: ${{ secrets.YT_REFRESH_SYLVASMYSTERIES }}
          YT_REFRESH_ANIMEVAULT: ${{ secrets.YT_REFRESH_ANIMEVAULT }}
          YT_REFRESH_AXOLOTLDRAMA: ${{ secrets.YT_REFRESH_AXOLOTLDRAMA }}
        shell: bash
        run: |
          node <<'EOF'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const names = [
            "YT_CLIENT_SECRET",
            "YT_REFRESH_THEARCHIVELIVES",
            "YT_REFRESH_FIXEDFIGHTS",
            "YT_REFRESH_SYLVASMYSTERIES",
            "YT_REFRESH_ANIMEVAULT",
            "YT_REFRESH_AXOLOTLDRAMA",
          ];
          const pub = Buffer.from(process.env.PUB, "base64").toString("utf8");
          fs.mkdirSync("out", { recursive: true });
          // Fingerprints travel inside the artifact, never through the public
          // log. They let the dispatcher prove the decrypted value matches
          // what this job held, without revealing anything about it.
          const manifest = {};
          for (const name of names) {
            const value = (process.env[name] ?? "").trim();
            if (!value) {
              console.log(`${name}: EMPTY -- not exported`);
              manifest[name] = null;
              continue;
            }
            const enc = crypto.publicEncrypt(
              {
                key: pub,
                padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
                oaepHash: "sha256",
              },
              Buffer.from(value, "utf8"),
            );
            fs.writeFileSync(`out/${name}.enc.b64`, enc.toString("base64"));
            manifest[name] = {
              bytes: Buffer.byteLength(value, "utf8"),
              sha256_12: crypto
                .createHash("sha256")
                .update(value)
                .digest("hex")
                .slice(0, 12),
            };
            console.log(`${name}: encrypted`);
          }
          fs.writeFileSync("out/manifest.json", JSON.stringify(manifest, null, 2));
          EOF

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@v4
        with:
          name: bridge-out
          path: out/
          retention-days: 1
